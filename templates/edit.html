<!DOCTYPE html>
<html>
<head>
    <title>Edit Ebook</title>

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">

        <h3 class="text-center mb-3">Edit Ebook</h3>

        <form method="POST">
            
            <!-- Judul -->
            <label class="form-label">Judul Ebook</label>
            <input type="text" 
                   name="title" 
                   value="{{ ebook.title }}" 
                   class="form-control mb-3" 
                   required>

            <!-- Tombol -->
            <button class="btn btn-success w-100 mb-2">Simpan</button>

            <a href="/" class="btn btn-secondary w-100">Kembali</a>

        </form>

    </div>

</div>

</body>
</html>
